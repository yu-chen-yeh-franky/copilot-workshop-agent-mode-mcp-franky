<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>待辦清單</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page">
    <section class="todo-card" aria-label="待辦清單應用程式">
      <header class="card-header">
        <h1 class="title">待辦清單</h1>
        <button id="themeToggleBtn" class="theme-toggle-btn" type="button" aria-label="切換深淺色模式">
          🌙 深色模式
        </button>
      </header>

      <form class="todo-form" id="todoForm" autocomplete="off">
        <label class="sr-only" for="todoInput">輸入待辦事項</label>
        <input
          id="todoInput"
          class="todo-input"
          type="text"
          placeholder="輸入待辦事項..."
          maxlength="120"
        />
        <button class="add-btn" type="submit">新增</button>
      </form>

      <div class="filter-group" role="group" aria-label="待辦篩選">
        <button class="filter-btn is-active" type="button" data-filter="all">全部</button>
        <button class="filter-btn" type="button" data-filter="active">未完成</button>
        <button class="filter-btn" type="button" data-filter="completed">已完成</button>
      </div>

      <ul class="todo-list" id="todoList" aria-live="polite"></ul>
      <p class="empty-tip" id="emptyTip">還沒有任何待辦事項,新增一個吧!</p>

      <footer class="todo-footer">
        <p id="remainingText">未完成:0 項</p>
      </footer>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
